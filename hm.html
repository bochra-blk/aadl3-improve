<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reçu d'Inscription</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="receipt-container">
        <h1 class="title">وصل بالتسجيل الاولي</h1>
        <div class="registration-details">
            <p><strong>رقم الضمان الاجتماعي:</strong> 123456765456</p>
            <p><strong>رقم التعريف الوطني:</strong> 109284567367812345</p>
            <p><strong>الولاية:</strong> تمنراست</p>
            <p><strong>رقم الهاتف:</strong> 063456789</p>
        </div>
        
        <div class="footer">
            <p>شكرا على المشاركة!</p>
            <p>في حالة اي عطل يمكنكم التواصل مع مصالح العميل الخاصة بنا</p>
            <button class="print-button">
                <img src="imprime.png" alt="Imprimer" class="button-icon">
                طباعة
            </button>
        </div>
    </div>
</body>
</html>
